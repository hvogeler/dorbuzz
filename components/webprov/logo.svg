<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <!-- Outer circle border -->
    <circle cx="50" cy="50" r="48" fill="none" stroke="#1565c0" stroke-width="2" />

    <!-- Door frame -->
    <rect x="30" y="20" width="40" height="55" rx="3" fill="none" stroke="#1565c0" stroke-width="2.5" />

    <!-- Door panel -->
    <rect x="34" y="24" width="32" height="47" rx="1" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" />

    <!-- Door handle -->
    <circle cx="58" cy="48" r="2.5" fill="#1565c0" />

    <!-- Buzzer/speaker icon above door -->
    <circle cx="50" cy="14" r="3" fill="#1565c0" />

    <!-- Sound waves from buzzer -->
    <path d="M 57 14 Q 60 10, 57 6" fill="none" stroke="#42a5f5" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 60 16 Q 64 10, 60 4" fill="none" stroke="#90caf9" stroke-width="1.5" stroke-linecap="round" />

    <!-- Floor/threshold -->
    <rect x="25" y="75" width="50" height="3" fill="#1565c0" />

    <!-- WiFi symbol at bottom -->
    <path d="M 42 87 Q 50 80, 58 87" fill="none" stroke="#42a5f5" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 46 90 Q 50 85, 54 90" fill="none" stroke="#42a5f5" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="50" cy="92" r="1.5" fill="#42a5f5" />
</svg>
